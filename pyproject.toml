[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-uav-rescue"
version = "0.1.0"
description = "山区洪涝灾害下无人机运输与通信协同优化"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "scipy>=1.13",
]

[project.scripts]
huawei-q1 = "uav_rescue.cli.q1:main"
huawei-q2 = "uav_rescue.cli.q2:main"
huawei-q2-soft = "uav_rescue.cli.q2_soft:main"
huawei-q2b = "uav_rescue.cli.q2b:main"
huawei-q2b-time = "uav_rescue.cli.q2b_time:main"
huawei-q3 = "uav_rescue.cli.q3:main"
huawei-q2b-soft = "uav_rescue.cli.q2b_soft:main"
huawei-q2b-joint = "uav_rescue.cli.q2b_joint:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
