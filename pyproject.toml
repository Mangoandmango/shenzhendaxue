[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-uav-rescue"
version = "0.1.0"
description = "山区洪涝灾害下无人机运输与通信协同优化"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "Pillow>=10.0",
]

[project.scripts]
huawei-q1 = "uav_rescue.cli.q1:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
